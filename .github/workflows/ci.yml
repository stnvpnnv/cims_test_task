name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.1.3"
  POETRY_NO_INTERACTION: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.14"

      - name: Install Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"

      - name: Validate lock file and install dependencies
        run: |
          poetry check --lock
          poetry sync --no-ansi

      - name: Check lint and formatting
        run: |
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Run repository hooks
        env:
          # This hook guards local commits to main; CI must also run on main.
          SKIP: no-commit-to-branch
        run: poetry run pre-commit run --all-files --show-diff-on-failure

      - name: Check types
        run: poetry run mypy

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: cims_test
          POSTGRES_USER: cims_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U cims_ci -d cims_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

      rabbitmq:
        image: rabbitmq:4.3.4-management
        env:
          RABBITMQ_DEFAULT_USER: cims_ci
          RABBITMQ_DEFAULT_PASS: ci-only-password
          RABBITMQ_DEFAULT_VHOST: cims_test
        ports:
          - 5672/tcp
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 20s

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12.14"

      - name: Install Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"

      - name: Validate lock file and install dependencies
        run: |
          poetry check --lock
          poetry sync --no-ansi

      - name: Run all tests with coverage
        env:
          # These credentials belong only to disposable CI services.
          CIMS_TEST_DATABASE_URL: postgresql+asyncpg://cims_ci:ci-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/cims_test
          CIMS_TEST_RABBITMQ_URL: amqp://cims_ci:ci-only-password@127.0.0.1:${{ job.services.rabbitmq.ports['5672'] }}/cims_test
        run: poetry run pytest --junitxml=junit.xml

      - name: Reject skipped tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          report = ET.parse("junit.xml")
          skipped = report.findall(".//testcase/skipped")
          if skipped:
              raise SystemExit(f"CI requires all tests to run; skipped: {len(skipped)}")
          print("All collected tests ran without skips.")
          PY

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn
          retention-days: 7

  docker-build:
    name: Docker build
    needs: [quality, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Build runtime image without publishing
        run: docker build --target runtime --tag cims-task-service:ci .
